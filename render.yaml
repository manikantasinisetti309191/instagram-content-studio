services:
  - type: web
    name: instagram-content-studio
    runtime: node
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTO_SCHEDULE
        value: "false"
      - key: PUBLIC_BASE_URL
        value: "https://instagram-content-studio.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: NGROK_AUTHTOKEN
        sync: false
