services:
  - type: web
    name: instagram-content-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: NGROK_AUTHTOKEN
        sync: false
      - key: AUTO_SCHEDULE
        value: "false"
      - key: PUBLIC_BASE_URL
        value: ""   # Set this to your Render service URL after first deploy, e.g. https://your-app.onrender.com

    healthCheckPath: /api/status
    disk:
      name: data
      mountPath: /app/backend/data
      sizeGB: 1
